name: Update Blog Posts

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch: {}

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install rss-parser

      - name: Fetch and parse blog posts
        id: blog
        run: |
          const Parser = require('rss-parser');
          const parser = new Parser();

          (async () => {
            const feed = await parser.parseURL('https://atheerium.github.io/rss.xml');
            const items = feed.items.slice(0, 5); // Get latest 5 posts
            let markdown = '';
            for (const item of items) {
              const date = new Date(item.isoDate).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
              });
              markdown += `- [${item.title}](${item.link}) - ${date}\n`;
            }
            // Output as step output
            const output = markdown.trim();
            console.log(`::set-output name=result::${output}`);
          })();
        shell: node

      - name: Update README with blog posts
        run: |
          BLOG_POSTS="${{ steps.blog.outputs.result }}"
          # Replace content between the markers
          sed -i '/<!-- BLOG-POSTS:START -->/,/<!-- BLOG-POSTS:END -->/{/<!-- BLOG-POSTS:START -->/{n;:/<!-- BLOG-POSTS:END -->/!d;};/<!-- BLOG-POSTS:END -->/{n;:/<!-- BLOG-POSTS:START -->/!d;};/<!-- BLOG-POSTS:START -->/a\
'"$BLOG_POSTS"'
          d;}' README.md
        # Alternative simpler approach: delete everything between markers and insert new content
        # But let's use a more reliable method with awk
        awk -v start="<!-- BLOG-POSTS:START -->" -v end="<!-- BLOG-POSTS:END -->" -v insert="$BLOG_POSTS" '
        /start/ { print; print insert; next }
        /end/ { if (!printed) { print insert; printed=1 }; print; next }
        !/start/ && !/end/ { print }
        ' README.md > README.md.tmp && mv README.md.tmp README.md

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update latest blog posts"
            git push
          else
            echo "No changes to README.md"
          fi